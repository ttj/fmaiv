name: examples

# Verify every day's worked examples by running the tools on them (z3, NuSMV,
# Lean/lake, CBMC, Cryptol, SAW) inside the course image, which has them all
# preinstalled. Mirrors scripts/check_examples.sh. We also execute the online
# runner notebooks end-to-end so Colab/Codespace stays in lockstep with the repo.

on:
  push:
    branches: [main]
    paths:
      - "day*/examples/**"
      - "notebooks/**"
      - "scripts/check_examples.sh"
      - "scripts/lint-examples.sh"
      - "scripts/run_notebooks.sh"
      - "scripts/smv2lean/**"
      - ".github/workflows/examples.yml"
  pull_request:
    paths:
      - "day*/examples/**"
      - "notebooks/**"
      - "scripts/check_examples.sh"
      - "scripts/lint-examples.sh"
      - "scripts/run_notebooks.sh"
      - "scripts/smv2lean/**"
      - ".github/workflows/examples.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: read

jobs:
  # Fast guard: every example file under day*/examples/ must be referenced
  # from either scripts/check_examples.sh or one of the runner notebooks.
  # Catches "added an example, forgot to wire it" -- the failure mode that
  # silently leaves a file out of the grader and out of the Codespace
  # learning path even when the repo merges cleanly.  Runs in seconds on
  # a stock ubuntu-latest -- no Docker image required.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Lint examples (every file must be exercised)
        run: bash scripts/lint-examples.sh

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run all example verifications in the course image
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            ghcr.io/ttj/fmaiv-autograde:latest \
            bash scripts/check_examples.sh

  # Execute the Day 1-4 runner notebooks headlessly in the same course image.
  # They find the checked-out repo (no clone) and run the real example files, so
  # this proves the notebooks work end-to-end exactly as a student would see them.
  notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Execute Day 1-4 runner notebooks in the course image
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            ghcr.io/ttj/fmaiv-autograde:latest \
            bash scripts/run_notebooks.sh \
              notebooks/01_day1_logic_sat_smt.ipynb \
              notebooks/02_day2_model_checking.ipynb \
              notebooks/03_day3_theorem_proving.ipynb \
              notebooks/04_day4_program_verif.ipynb

  # The Day-4 NN script needs PyTorch (kept OUT of the course image to keep it
  # lean). torch is PINNED: newer torch removed torch.onnx.symbolic_helper.
  # _quantized_ops, which the pinned auto_LiRPA still uses. (The NN *notebooks*
  # 05/06 are exercised in the `colab` job below, in a clean Colab-like env.)
  nn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned CPU PyTorch + auto_LiRPA
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
          pip install git+https://github.com/Verified-Intelligence/auto_LiRPA.git@ca767f1d8c0a6b125a292ba165adb2319bbaf615
      - name: Certify the NN robustness example (script form)
        run: python day04/examples/nn/robustness.py

  # Colab-style coverage: run EVERY runner notebook in a clean Ubuntu 22.04 (root,
  # nothing preinstalled -- like Google Colab), so the notebooks' own install
  # branches run end-to-end. The preinstalled-image jobs above can't catch install
  # bugs; this can. 05/06 here force-install the pinned torch + auto_LiRPA (+ MNIST),
  # which is exactly the Colab path that broke with a newer torch.
  colab:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        nb:
          - 01_day1_logic_sat_smt
          - 02_day2_model_checking
          - 03_day3_theorem_proving
          - 04_day4_program_verif
          - 05_day4_nn_robustness
          - 06_day4_nn_mnist
    steps:
      - uses: actions/checkout@v6
      - name: Run ${{ matrix.nb }} in a clean Ubuntu 22.04 (Colab-like) container
        run: |
          docker run --rm -e FMAIV_INSTALL_CRYPTOL_SAW=1 -v "$PWD:/work" -w /work ubuntu:22.04 bash -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq && apt-get install -y -qq python3 python3-pip git curl ca-certificates >/dev/null
            bash scripts/run_notebooks.sh notebooks/${{ matrix.nb }}.ipynb'

  # Build the Mathlib-using sister project under day03/examples/MathlibDemos.
  # This is kept separate from CounterDemo (which is intentionally Mathlib-free)
  # so the main Day-3 build stays fast. The lean-action handles elan install +
  # Mathlib's binary cache (`lake exe cache get`), so this job finishes in a
  # few minutes per run, not hours.
  mathlib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: day03/examples/MathlibDemos
          use-mathlib-cache: true

  # Smoke-test the SMV->Lean translator (Day-3 "translate-then-prove" tool). It is
  # student-facing (notebooks/README points at scripts/smv2lean/to_lean.sh) but
  # has no other CI; a grammar/dependency break would otherwise surface only when
  # a student runs it.
  smv2lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Translate an SMV model to Lean and assert output
        run: |
          pip install -r scripts/smv2lean/requirements.txt
          python scripts/smv2lean/smv2lean.py day02/examples/peterson.smv /tmp/peterson.lean
          test -s /tmp/peterson.lean && echo "smv2lean produced a non-empty Lean file"
