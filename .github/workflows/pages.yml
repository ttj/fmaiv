name: pages

# Render the four day decks (Pandoc markdown) to RevealJS HTML and publish to
# GitHub Pages. After the first successful run, the slides are at:
#   https://ttj.github.io/fmaiv/            (index)
#   https://ttj.github.io/fmaiv/day01.html  (etc.)
#
# One-time setup: repo Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      # NB: in GitHub path globs `?` means "zero or one of the preceding char",
      # so "day0?/slides" never matched day01..day04. Use "day*" instead.
      - "day*/slides/*.md"
      - "reveal-custom.css"
      - "reveal-neutral.css"
      - "reveal-fit.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Render decks to RevealJS
        run: |
          set -euo pipefail
          mkdir -p _site
          for d in day01 day02 day03 day04; do
            src="$d/slides/$d.md"
            [ -f "$src" ] || { echo "skip $d (no $src)"; continue; }
            echo "rendering $src"
            pandoc "$src" -t revealjs -s -o "_site/$d.html" \
              --slide-level=2 --wrap=none --katex=https://cdn.jsdelivr.net/npm/katex@0.16.47/dist/ \
              -V revealjs-url=https://cdn.jsdelivr.net/npm/reveal.js@5.0.0 \
              -V theme=white -V transition=fade \
              -V width=1280 -V height=720 -V margin=0.04 \
              -V minScale=0.2 -V maxScale=1.5 \
              -V center=false \
              -V controls=true -V progress=true -V hash=true \
              -H reveal-custom.css -H reveal-neutral.css -A reveal-fit.html
          done

      - name: Render slide PDFs (decktape)
        run: |
          set -euo pipefail
          export PUPPETEER_SKIP_DOWNLOAD=1
          npm install -g decktape
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser || command -v chromium)"
          echo "using chrome: $CHROME"
          for d in day01 day02 day03 day04; do
            [ -f "_site/$d.html" ] || continue
            decktape --chrome-path "$CHROME" \
              --chrome-arg=--no-sandbox --chrome-arg=--disable-dev-shm-usage \
              --size 1280x720 reveal "_site/$d.html" "_site/$d.pdf"
          done

      - name: Build index page
        run: |
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>FMAIV — Slides</title>
            <style>
              body { font: 16px/1.6 system-ui, sans-serif; max-width: 760px;
                     margin: 4rem auto; padding: 0 1rem; color: #222; }
              h1 { font-size: 1.6rem; }
              a { color: #1a4fd6; text-decoration: none; }
              a:hover { text-decoration: underline; }
              li { margin: 0.6rem 0; }
              .sub { color: #666; font-size: 0.92rem; }
              .tip { color: #666; font-size: 0.9rem; margin-top: 2rem;
                     border-top: 1px solid #eee; padding-top: 1rem; }
            </style>
          </head>
          <body>
            <h1>FMAIV — Formal Methods &amp; AI-Assisted Verification</h1>
            <p class="sub">Slide decks (RevealJS). Use arrow keys to navigate, <b>S</b> for speaker notes, <b>F</b> for fullscreen, <b>Esc</b> for the slide grid. A <b>PDF</b> of each deck is linked for following along or printing.</p>
            <ul>
              <li><a href="day01.html">Day 1 — Foundations: logic, transition systems, SAT, SMT</a> &middot; <a href="day01.pdf">PDF</a></li>
              <li><a href="day02.html">Day 2 — Model checking with nuXmv</a> &middot; <a href="day02.pdf">PDF</a></li>
              <li><a href="day03.html">Day 3 — Theorem proving with Lean 4 (and AI)</a> &middot; <a href="day03.pdf">PDF</a></li>
              <li><a href="day04.html">Day 4 — Program &amp; high-assurance verification + frontier</a> &middot; <a href="day04.pdf">PDF</a></li>
            </ul>
            <p class="tip">Source: <a href="https://github.com/ttj/fmaiv">github.com/ttj/fmaiv</a></p>
          </body>
          </html>
          HTML

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
