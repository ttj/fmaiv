name: pages

# Render the four day decks (Pandoc markdown) to RevealJS HTML and publish to
# GitHub Pages. After the first successful run, the slides are at:
#   https://ttj.github.io/fmaiv/            (index)
#   https://ttj.github.io/fmaiv/day01.html  (etc.)
#
# One-time setup: repo Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      # NB: in GitHub path globs `?` means "zero or one of the preceding char",
      # so "day0?/slides" never matched day01..day04. Use "day*" instead.
      - "day*/slides/*.md"
      - "reveal-custom.css"
      - "reveal-neutral.css"
      - "reveal-fit.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Render decks to RevealJS
        run: |
          set -euo pipefail
          mkdir -p _site
          for d in day01 day02 day03 day04; do
            src="$d/slides/$d.md"
            [ -f "$src" ] || { echo "skip $d (no $src)"; continue; }
            echo "rendering $src"
            pandoc "$src" -t revealjs -s -o "_site/$d.html" \
              --slide-level=2 --wrap=none --katex=https://cdn.jsdelivr.net/npm/katex@0.16.47/dist/ \
              -V revealjs-url=https://cdn.jsdelivr.net/npm/reveal.js@5.0.0 \
              -V theme=white -V transition=fade \
              -V width=1280 -V height=720 -V margin=0.04 \
              -V minScale=0.2 -V maxScale=1.5 \
              -V center=false \
              -V controls=true -V progress=true -V hash=true \
              -H reveal-custom.css -H reveal-neutral.css -A reveal-fit.html
          done

      - name: Render slide PDFs (decktape)
        run: |
          set -euo pipefail
          export PUPPETEER_SKIP_DOWNLOAD=1
          npm install -g decktape
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser || command -v chromium)"
          echo "using chrome: $CHROME"
          for d in day01 day02 day03 day04; do
            [ -f "_site/$d.html" ] || continue
            decktape --chrome-path "$CHROME" \
              --chrome-arg=--no-sandbox --chrome-arg=--disable-dev-shm-usage \
              --size 1280x720 reveal "_site/$d.html" "_site/$d.pdf"
          done

      - name: Build index page
        run: |
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>FMAIV — Formal Methods &amp; AI-Assisted Verification</title>
            <style>
              @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Libre+Caslon+Text:wght@400;700&display=swap');
              :root { --gold:#B49248; --oak:#946E24; --ink:#1c1c1c; --muted:#4d4640; --rule:#e4e4e4; --soft:#f6eeda; }
              * { box-sizing: border-box; }
              body { font: 16px/1.65 'Inter', system-ui, -apple-system, sans-serif; color: var(--ink);
                     max-width: 820px; margin: 0 auto; padding: 3rem 1.25rem 4rem; }
              a { color: var(--oak); text-decoration: none; }
              a:hover { text-decoration: underline; }
              header { border-bottom: 3px solid var(--gold); padding-bottom: 1rem; margin-bottom: 1.4rem; }
              .kicker { color: var(--oak); font-weight: 600; font-size: .78rem; text-transform: uppercase;
                        letter-spacing: .09em; margin: 0 0 .45rem; }
              h1 { font-family: 'Libre Caslon Text', Georgia, serif; font-weight: 700;
                   font-size: 2rem; line-height: 1.12; margin: 0 0 .4rem; }
              .tagline { color: var(--muted); font-size: 1.05rem; margin: 0; }
              h2 { font-size: 1.05rem; letter-spacing: -.01em; margin: 2.1rem 0 .5rem;
                   padding-bottom: .25rem; border-bottom: 1px solid var(--rule); }
              p { margin: .6rem 0; }
              ul { margin: .4rem 0; padding-left: 1.25rem; }
              li { margin: .5rem 0; }
              .day { font-weight: 600; }
              .muted { color: var(--muted); }
              .small { font-size: .9rem; }
              ul.tools { list-style: none; padding-left: 0; }
              ul.tools > li { padding-left: 1.3rem; position: relative; }
              ul.tools > li::before { content: "\25B8"; color: var(--gold); position: absolute; left: 0; top: 0; }
              code { font-family: 'JetBrains Mono', ui-monospace, monospace; background: var(--soft);
                     color: var(--oak); padding: .03em .35em; border-radius: 4px; font-size: .88em; }
              footer { margin-top: 2.6rem; border-top: 1px solid var(--rule); padding-top: 1.1rem;
                       color: var(--muted); font-size: .9rem; line-height: 1.55; }
            </style>
          </head>
          <body>
            <header>
              <p class="kicker">Vanderbilt University &middot; College of Connected Computing</p>
              <h1>FMAIV — Formal Methods &amp; AI-Assisted Verification</h1>
              <p class="tagline">A hands-on four-day short course on proving software and systems correct — and on how AI is changing that practice.</p>
            </header>
            <p>Each day builds one pillar of the modern verification toolkit and applies it to a shared set of running examples: <b>SAT/SMT solving</b>, <b>model checking</b>, <b>interactive theorem proving</b>, and <b>program &amp; high-assurance verification</b> — closing on the <b>AI frontier</b> (neural-network verification and AI-assisted proof). Every idea ships with runnable code, and everything below runs in the browser with no local install.</p>
            <h2>Slides</h2>
            <ul>
              <li><span class="day">Day 1</span> — Foundations: logic, transition systems, SAT, SMT &middot; <a href="day01.html">slides</a> &middot; <a href="day01.pdf">PDF</a></li>
              <li><span class="day">Day 2</span> — Model checking with nuXmv &middot; <a href="day02.html">slides</a> &middot; <a href="day02.pdf">PDF</a></li>
              <li><span class="day">Day 3</span> — Theorem proving with Lean 4 (and AI) &middot; <a href="day03.html">slides</a> &middot; <a href="day03.pdf">PDF</a></li>
              <li><span class="day">Day 4</span> — Program &amp; high-assurance verification + the frontier &middot; <a href="day04.html">slides</a> &middot; <a href="day04.pdf">PDF</a></li>
            </ul>
            <p class="muted small">In a deck: arrow keys navigate, <b>S</b> speaker notes, <b>F</b> fullscreen, <b>Esc</b> the slide grid.</p>
            <h2>Run it online — no install</h2>
            <ul class="tools">
              <li><a href="https://codespaces.new/ttj/fmaiv">GitHub Codespaces</a> — the full toolset preinstalled (z3, NuSMV, Lean 4, CBMC, Cryptol, SAW, smvis). One click, runs in your browser.</li>
              <li>Google Colab notebooks (zero setup): <a href="https://colab.research.google.com/github/ttj/fmaiv/blob/main/notebooks/01_z3_python.ipynb">Z3 in Python</a> &middot; <a href="https://colab.research.google.com/github/ttj/fmaiv/blob/main/notebooks/02_tools_cli.ipynb">CBMC &amp; NuSMV</a> &middot; <a href="https://colab.research.google.com/github/ttj/fmaiv/blob/main/day04/examples/nn/robustness.ipynb">neural-network robustness</a>.</li>
              <li><a href="https://bit.ly/fmaiv_smvis">smvis web app</a> — run nuXmv (spec checking, state/BDD visualization) in the browser and upload your own <code>.smv</code> files.</li>
            </ul>
            <h2>On GitHub</h2>
            <ul>
              <li>Repository: <a href="https://github.com/ttj/fmaiv">github.com/ttj/fmaiv</a> — slide sources plus each day's <code>examples/</code> and <code>assignments/</code>, and a <a href="https://github.com/ttj/fmaiv/tree/main/capstone">capstone</a> that runs one property through all four tools.</li>
              <li>Get started online: <a href="https://github.com/ttj/fmaiv/blob/main/notebooks/README.md">notebooks/README</a> walks through Codespaces and Colab.</li>
              <li>Lean translator: <a href="https://github.com/ttj/leansmv">ttj/leansmv</a> — the SMV → Lean 4 toolkit vendored into Day 3.</li>
            </ul>
            <footer>
              Taught by <a href="https://www.taylortjohnson.com/">Taylor Johnson</a> (taylor.johnson@vanderbilt.edu) and <a href="https://woodingben.com/">Ben Wooding</a> (ben.wooding@vanderbilt.edu).<br>
              Vanderbilt University &middot; College of Connected Computing &middot; <a href="https://github.com/ttj/fmaiv">source on GitHub</a>
            </footer>
          </body>
          </html>
          HTML

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
