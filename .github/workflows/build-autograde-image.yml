name: build-autograde-image

# Builds the FMAIV autograde image (ghcr.io/ttj/fmaiv-autograde) that Codespaces
# (.devcontainer) and CI (examples.yml check/notebooks jobs) run on. All tools are
# open source / freely redistributable (Z3, Lean, CBMC, Cryptol, SAW, NuSMV, smvis),
# so the GHCR package can be PUBLIC -- students and CI pull it with no secrets.
#
# The image is hosted under the SAME owner as this repo (ttj), so the default
# GITHUB_TOKEN can push it -- no PAT needed. Requires repo Settings -> Actions ->
# General -> Workflow permissions = "Read and write". After the FIRST push, set the
# ghcr.io/ttj/fmaiv-autograde package visibility to PUBLIC (github.com/ttj?tab=
# packages -> fmaiv-autograde -> Package settings -> Change visibility) so it pulls
# anonymously in Codespaces/CI/student repos.

on:
  push:
    branches: [main]
    paths:
      - "autograding/Dockerfile"
      - "autograding/scripts/**"
      - ".github/workflows/build-autograde-image.yml"
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/ttj/fmaiv-autograde

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: autograding
          file: autograding/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Reminder
        run: |
          echo "Pushed ${IMAGE}:latest."
          echo "If this is the first push, set the package PUBLIC:"
          echo "  github.com/ttj?tab=packages -> fmaiv-autograde -> Package settings"
          echo "  -> Change visibility -> Public   (so Codespaces/CI pull it anonymously)."
